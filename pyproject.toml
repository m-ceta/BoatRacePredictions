[project]
name = "boatrace-predictions"
version = "0.1.0"
description = "Boat race ranking prediction pipeline built from historical B/K text files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "catboost>=1.2.5",
  "lightgbm>=4.5.0",
  "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[project.scripts]
boatrace-build = "src.cli:build_dataset_main"
boatrace-train = "src.cli:train_main"
boatrace-predict = "src.cli:predict_main"
boatrace-predict-today = "src.cli:predict_today_main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
