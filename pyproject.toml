[project]
name = "boatrace-predictions"
version = "0.1.0"
description = "Boat race ranking prediction pipeline built from historical B/K text files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "beautifulsoup4>=4.12.0",
  "requests>=2.32.0",
  "lhafile>=0.3.0",
  "catboost>=1.2.5",
  "lightgbm>=4.5.0",
  "xgboost>=2.1.0",
  "scikit-learn==1.6.1",
  "joblib>=1.4.0",
  "streamlit>=1.45.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[project.scripts]
boatrace-backfill-rowdata = "src.cli:backfill_rowdata_main"
boatrace-build = "src.cli:build_dataset_main"
boatrace-compare-processed = "src.cli:compare_processed_tables_main"
boatrace-train = "src.cli:train_main"
boatrace-predict = "src.cli:predict_main"
boatrace-predict-today = "src.cli:predict_today_main"
boatrace-backtest-recent-week = "src.cli:backtest_recent_week_main"
boatrace-webui = "src.webui:main"
boatrace-webui-today = "src.webui_today:main"
boatrace-package-download = "src.cli:package_download_main"
boatrace-package-restore-local = "src.cli:package_restore_local_main"
boatrace-package-export = "src.cli:package_export_main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
