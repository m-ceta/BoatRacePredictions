data:
  processed_dir: data/processed
  training_table: data/processed/training_table.parquet
  min_date: "2023-01-01"
  max_date: "2026-02-28"
  rolling_years: 3

split:
  train_end_date: "2026-03-01"
  valid_end_date: "2026-06-30"
  valid_months: 4
  final_eval_months: 1

model:
  training_device: "cpu"
  iterations: 120
  learning_rate: 0.03
  depth: 6
  loss_function: YetiRankPairwise
  eval_metric: NDCG
  random_seed: 42
  gpu:
    catboost: false
    lightgbm: false
    device_id: 0

models:
  lightgbm_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: lightgbm_top1
        params:
          num_leaves: 15
          min_data_in_leaf: 50
          lambda_l2: 3.0
      - name: lightgbm_stable_top6
        params:
          num_leaves: 63
          min_data_in_leaf: 80
          feature_fraction: 0.65
          lambda_l2: 5.0

phase3:
  label_weights:
    exact_full: 1.0
    exact_top2: 0.75
    exact_first_with_two: 0.6
    exact_first: 0.5
    top2_overlap: 0.35
    top3_overlap: 0.2
  regularization:
    num_leaves: 31
    min_data_in_leaf: 30
    feature_fraction: 0.75
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l1: 0.0
    lambda_l2: 2.0
    num_boost_round: 120
  rerank:
    default_conservative_weight: 0.9
    weight_grid: [0.8, 0.9, 0.95]
    top_n_grid: [12]
    rank_penalty_strength_grid: [0.0, 0.01]
    default_rank_penalty_strength: 0.02
    rank_penalty_start: 5
    scenario_candidate_top_n: 12
    coarse_eval_max_races: 750
    coarse_penalty_grid: [0.0]
    fine_top_k: 8
    log_loss_max_delta_vs_v1: 0.03
    objective_top12_weight: 0.40
    objective_top5_weight: 0.15
    objective_top3_weight: 0.15
    objective_top1_weight: 0.15
    objective_mrr_weight: 0.15
    objective_log_loss_weight: 0.10
    objective_log_loss_excess_penalty: 1.0
  calibration:
    window_days_options: [30, 60, 90]
    default_window_days: 60
  evaluation:
    scenario_min_races: 100
  dynamic_rerank_weight:
    enabled: true
    optimize: true
    min_subset_races: 500
    top12_min_improvement: 0.0
    log_loss_max_delta: 0.03
    weight_grid: [0.7, 0.8, 0.9, 0.95]
    quantile_high: 0.75
    quantile_mid: 0.5

artifacts:
  catboost_model_path: artifacts/catboost_ranker.cbm
  lightgbm_model_path: artifacts/lightgbm_ranker.txt
  features_path: artifacts/feature_columns.json
  ensemble_weights_path: artifacts/ensemble_weights.json
  trifecta_calibrator_path: artifacts/trifecta_isotonic.joblib
  trifecta_v2_calibrator_path: artifacts/trifecta_v2_isotonic.joblib
  trifecta_v3_calibrator_path: artifacts/trifecta_v3_isotonic.joblib
  metrics_path: artifacts/metrics.json
