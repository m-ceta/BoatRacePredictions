data:
  processed_dir: data/processed
  training_table: data/processed/training_table.parquet
  min_date: "2023-01-29"
  max_date: "2026-07-28"
  rolling_years: 3.5

split:
  method: random_by_race
  train_ratio: 6
  valid_ratio: 1
  random_seed: 42

model:
  training_device: "cpu"
  iterations: 120
  learning_rate: 0.03
  depth: 6
  loss_function: YetiRankPairwise
  eval_metric: NDCG
  random_seed: 42
  gpu:
    catboost: false
    lightgbm: false
    device_id: 0

models:
  catboost:
    enabled: false
    params:
      loss_function: YetiRank
      eval_metric: NDCG
      depth: 8
      learning_rate: 0.02
      l2_leaf_reg: 5.0
      random_strength: 8.0
      bootstrap_type: Bayesian
      bagging_temperature: 3.0
      one_hot_max_size: 24
      od_type: Iter
      od_wait: 30
  ensemble:
    parallel_workers: 8
    max_eval_races: 10000
    grid_step: 0.10
    objective: trifecta_top12_balanced
    objective_top12_weight: 0.35
    objective_top5_weight: 0.25
    objective_top3_weight: 0.15
    objective_top1_weight: 0.10
    objective_top3_overlap_weight: 0.10
    objective_log_loss_weight: 0.05
  lightgbm_variants:
    enabled: true
    parallel_workers: 2
    num_threads_per_variant: 2
    variants:
      - name: lightgbm_legacy_features
        feature_set: legacy_20260712
        params:
          num_leaves: 63
          min_data_in_leaf: 50
      - name: lightgbm_stable_top6
        params:
          num_leaves: 63
          min_data_in_leaf: 80
          feature_fraction: 0.65
          lambda_l2: 5.0
  lightgbm_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: lightgbm_reg_finish_position
        target: finish_position
        score_transform: negative
        params:
          objective: regression
          metric: rmse
          num_leaves: 31
          min_data_in_leaf: 100
          learning_rate: 0.03
          feature_fraction: 0.70
          bagging_fraction: 0.80
          bagging_freq: 1
          lambda_l2: 8.0
  xgboost_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: xgboost_pairwise_conservative
        params:
          objective: rank:pairwise
          eval_metric: ndcg@12
          max_depth: 3
          eta: 0.025
          min_child_weight: 8.0
          subsample: 0.75
          colsample_bytree: 0.70
          lambda: 8.0
          alpha: 1.0
          gamma: 0.5
  xgboost_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: xgboost_reg_finish_position
        target: finish_position
        score_transform: negative
        params:
          objective: reg:squarederror
          eval_metric: rmse
          max_depth: 3
          eta: 0.025
          min_child_weight: 10.0
          subsample: 0.75
          colsample_bytree: 0.70
          lambda: 8.0
          alpha: 1.0
          gamma: 0.5
  random_forest_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: random_forest_reg_finish_position
        target: finish_position
        score_transform: negative
        params:
          n_estimators: 80
          max_depth: 10
          min_samples_leaf: 50
          max_features: 0.65
          bootstrap: true
          max_samples: 0.35
          random_state: 42
  ridge_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 1
    variants:
      - name: ridge_reg_finish_position
        target: finish_position
        score_transform: negative
        params:
          alpha: 10.0

artifacts:
  catboost_model_path: artifacts/catboost_ranker.cbm
  lightgbm_model_path: artifacts/lightgbm_ranker.txt
  xgboost_model_path: artifacts/xgboost_ranker.json
  random_forest_model_path: artifacts/random_forest_regressor.joblib
  ridge_model_path: artifacts/ridge_regressor.joblib
  features_path: artifacts/feature_columns.json
  ensemble_weights_path: artifacts/ensemble_weights.json
  trifecta_calibrator_path: artifacts/trifecta_isotonic.joblib
  metrics_path: artifacts/metrics.json
