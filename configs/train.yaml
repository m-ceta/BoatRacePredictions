data:
  processed_dir: data/processed
  training_table: data/processed/training_table.parquet
  min_date: "2023-01-29"
  max_date: "2026-07-28"
  rolling_years: 3.5

split:
  method: random_by_race
  train_ratio: 6
  valid_ratio: 1
  random_seed: 42

model:
  training_device: "cpu"
  iterations: 120
  learning_rate: 0.03
  depth: 6
  loss_function: YetiRankPairwise
  eval_metric: NDCG
  random_seed: 42
  gpu:
    catboost: false
    lightgbm: false
    device_id: 0

models:
  catboost:
    enabled: false
    params:
      loss_function: YetiRank
      eval_metric: NDCG
      depth: 8
      learning_rate: 0.02
      l2_leaf_reg: 5.0
      random_strength: 8.0
      bootstrap_type: Bayesian
      bagging_temperature: 3.0
      one_hot_max_size: 24
      od_type: Iter
      od_wait: 30
  ensemble:
    parallel_workers: 4
    model_metrics_parallel_workers: 2
    grid_step: 0.10
    max_model_weight: 0.50
    min_nonzero_weight: 0.10
    cross_validation:
      enabled: true
      folds: 3
      method: race_id_hash
    objective: trifecta_value_balanced
    objective_top12_weight: 0.25
    objective_top5_weight: 0.20
    objective_top3_weight: 0.25
    objective_top1_weight: 0.10
    objective_top3_overlap_weight: 0.00
    objective_recovery_weight: 0.20
    objective_value_hit_weight: 0.05
    objective_top12_payout_weight: 0.08
    objective_log_loss_weight: 0.05
    recovery_score_cap: 0.80
    top12_payout_score_cap: 8000
    min_purchase_rate: 0.10
    purchase_rate_penalty_weight: 0.20
    value_confidence_calibration:
      enabled: true
    value_rule:
      high: top3
      middle: top3
      low: skip
  lightgbm_variants:
    enabled: true
    parallel_workers: 2
    num_threads_per_variant: 2
    variants:
      - name: lightgbm_legacy_features
        feature_set: legacy_20260712
        params:
          num_leaves: 63
          min_data_in_leaf: 50
      - name: lightgbm_stable_top6
        params:
          num_leaves: 63
          min_data_in_leaf: 80
          feature_fraction: 0.65
          lambda_l2: 5.0
      - name: lightgbm_upset_variant
        params:
          num_leaves: 63
          min_data_in_leaf: 80
          feature_fraction: 0.70
          lambda_l2: 8.0
        upset_training:
          enabled: true
          history_years: 10.0
          recent_years: 3.5
          middle_cutoff_years: 7.0
          payout_threshold: 10000
          control_ratio: 3
          recent_history_weight: 0.7
          older_history_weight: 0.3
          payout_weight_10000: 2.0
          payout_weight_50000: 3.0
          payout_weight_100000: 5.0
          random_seed: 42
      - name: lightgbm_value_recovery_variant
        params:
          num_leaves: 31
          min_data_in_leaf: 120
          learning_rate: 0.025
          feature_fraction: 0.65
          bagging_fraction: 0.75
          bagging_freq: 1
          lambda_l1: 1.0
          lambda_l2: 12.0
        value_recovery_training:
          enabled: true
          payout_weight_under_1000: 0.7
          payout_weight_1000_5000: 1.0
          payout_weight_5000_10000: 1.3
          payout_weight_10000_30000: 1.8
          payout_weight_30000_50000: 1.2
          payout_weight_50000_over: 0.6
  lightgbm_seed_ensemble:
    enabled: false
    seeds: [42, 202, 777]
    parallel_workers: 2
    num_threads_per_seed: 2
  lightgbm_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: lightgbm_reg_finish_position
        enabled: false
        target: finish_position
        score_transform: negative
        params:
          objective: regression
          metric: rmse
          num_leaves: 31
          min_data_in_leaf: 100
          learning_rate: 0.03
          feature_fraction: 0.70
          bagging_fraction: 0.80
          bagging_freq: 1
          lambda_l2: 8.0
  xgboost_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: xgboost_pairwise_conservative
        params:
          objective: rank:pairwise
          eval_metric: ndcg@12
          max_depth: 3
          eta: 0.025
          min_child_weight: 8.0
          subsample: 0.75
          colsample_bytree: 0.70
          lambda: 8.0
          alpha: 1.0
          gamma: 0.5
  xgboost_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: xgboost_reg_finish_position
        enabled: false
        target: finish_position
        score_transform: negative
        params:
          objective: reg:squarederror
          eval_metric: rmse
          max_depth: 3
          eta: 0.025
          min_child_weight: 10.0
          subsample: 0.75
          colsample_bytree: 0.70
          lambda: 8.0
          alpha: 1.0
          gamma: 0.5
  random_forest_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 2
    variants:
      - name: random_forest_reg_finish_position
        enabled: false
        target: finish_position
        score_transform: negative
        params:
          n_estimators: 80
          max_depth: 10
          min_samples_leaf: 50
          max_features: 0.65
          bootstrap: true
          max_samples: 0.35
          random_state: 42
  ridge_regression_variants:
    enabled: true
    parallel_workers: 1
    num_threads_per_variant: 1
    variants:
      - name: ridge_reg_finish_position
        target: finish_position
        score_transform: negative
        params:
          alpha: 10.0
  neural_regression_variants:
    enabled: true
    parallel_workers: 1
    variants:
      - name: mlp_reg_finish_position
        model_type: mlp
        target: finish_position
        score_transform: negative
        params:
          hidden_units: [256, 128, 64, 32]
          embedding_dim: 8
          dropout: 0.10
          learning_rate: 0.001
          weight_decay: 0.0001
          epochs: 20
          batch_size: 4096
          patience: 5
          torch_num_threads: 2
          device: auto
          device_id: 0
          predict_device: cpu
      - name: mlp_reg_value_recovery
        model_type: mlp
        target: finish_position
        score_transform: negative
        value_recovery_training:
          enabled: true
          payout_weight_under_1000: 0.7
          payout_weight_1000_5000: 1.0
          payout_weight_5000_10000: 1.3
          payout_weight_10000_30000: 1.8
          payout_weight_30000_50000: 1.2
          payout_weight_50000_over: 0.6
        params:
          hidden_units: [256, 128, 64, 32]
          embedding_dim: 8
          dropout: 0.10
          learning_rate: 0.001
          weight_decay: 0.0001
          epochs: 20
          batch_size: 4096
          patience: 5
          torch_num_threads: 2
          device: auto
          device_id: 0
          predict_device: cpu
      - name: tabnet_reg_finish_position
        enabled: false
        model_type: tabnet
        target: finish_position
        score_transform: negative
        params:
          n_d: 16
          n_a: 16
          n_steps: 4
          gamma: 1.5
          lambda_sparse: 0.0001
          learning_rate: 0.001
          max_epochs: 30
          batch_size: 4096
          virtual_batch_size: 512
          patience: 5
          device: auto
          predict_device: cpu

  artifacts:
    catboost_model_path: artifacts/catboost_ranker.cbm
    lightgbm_model_path: artifacts/lightgbm_ranker.txt
    xgboost_model_path: artifacts/xgboost_ranker.json
    random_forest_model_path: artifacts/random_forest_regressor.joblib
    ridge_model_path: artifacts/ridge_regressor.joblib
    neural_model_path: artifacts/neural_regressor.joblib
    features_path: artifacts/feature_columns.json
    ensemble_weights_path: artifacts/ensemble_weights.json
    trifecta_calibrator_path: artifacts/trifecta_isotonic.joblib
    probability_adjustment_path: artifacts/probability_adjustment.json
  metrics_path: artifacts/metrics.json
